<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root, [data-theme="light"] {
  --bg:#f7f6f2;--surface:#ffffff;--surface2:#f3f0ec;
  --border:oklch(from #28251d l c h / 0.12);--divider:oklch(from #28251d l c h / 0.07);

  --primary:#01696f;--primary-hover:#0c4e54;--primary-text:#ffffff;

  --ease:160ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"] {
  --bg:#141311;--surface:#1c1b19;--surface2:#242320;
  --border:oklch(from #cdccca l c h / 0.14);--divider:oklch(from #cdccca l c h / 0.07);
  --text:#d0cfc9;--muted:#7a7975;--faint:#4e4d4a;
  --primary:#4f98a3;--primary-hover:#3e8592;--primary-text:#0f1e20;
  --d1-bg:#1b2e30;--d1-fg:#5db3bf;--d2-bg:#2a1e14;--d2-fg:#d4845a;
  --win-bg:#1a2e1a;--win-fg:#7dca7d;
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#141311;--surface:#1c1b19;--surface2:#242320;--border:oklch(from #cdccca l c h / 0.14);--divider:oklch(from #cdccca l c h / 0.07);--text:#d0cfc9;--muted:#7a7975;--faint:#4e4d4a;--primary:#4f98a3;--primary-hover:#3e8592;--primary-text:#0f1e20;--d1-bg:#1b2e30;--d1-fg:#5db3bf;--d2-bg:#2a1e14;--d2-fg:#d4845a;--win-bg:#1a2e1a;--win-fg:#7dca7d}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}
button,input{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
.embed{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);font-size:13px;max-width:900px;margin:0 auto}
.header{padding:14px 16px 10px;border-bottom:1px solid var(--divider)}
.title{font-size:15px;font-weight:700;color:var(--text)}
.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--divider)}
.search-box{flex:1;min-width:160px}
.search-box input{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);font-size:12px;color:var(--text)}
.search-box input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.filter-toggle{display:flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0}
.filter-btn{padding:6px 10px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background var(--ease),color var(--ease)}
.filter-btn.active{background:var(--primary);color:var(--primary-text)}
.filter-btn:not(.active):hover{background:var(--surface2);color:var(--text)}
#map{height:540px;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--divider);font-size:11px;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:var(--r-md);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.popup-title{font-weight:700;font-size:13px;margin-bottom:2px}
.popup-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.popup-link{color:var(--primary);font-weight:600;font-size:11.5px;text-decoration:none}
.leaflet-tooltip{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;box-shadow:var(--shadow);padding:4px 8px}
.footer-note{padding:8px 14px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--divider)}
.reset-view-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;font-weight:600;box-shadow:var(--shadow);transition:background var(--ease)}
.reset-view-btn:hover{background:var(--surface2)}
@media (max-width:700px){ #map{height:420px} }
</style>
</head>

  const typeColors = { suburban:"#d1a600", "north-brandywine":"#1569b3" };

  const map = L.map('map', { scrollWheelZoom:false }).setView([39.745,-75.62], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {

    maxZoom: 19
  }).addTo(map);

  function makeIcon(type){
    const c = typeColors[type] || "#01696f";
    return L.divIcon({
      className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)"></div>`,

    });
  }

  const markers = [];

  POOLS.forEach((p) => {
    const marker = L.marker([p.lat,p.lng], { icon: makeIcon(p.type) }).addTo(map);
    marker.bindTooltip(p.name, { direction:'top', offset:[0,-10] });
    const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}`;

      </div>
    `);
    markers.push({marker, data:p});
  });

  const DEFAULT_CENTER = [39.745,-75.62];
  const DEFAULT_ZOOM = 11;
  const ResetControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function() {
      const btn = L.DomUtil.create('button', 'reset-view-btn');
      btn.innerHTML = 'Reset';
      btn.title = 'Reset map view';
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', () => { map.setView(DEFAULT_CENTER, DEFAULT_ZOOM, { animate:true }); });
      return btn;
    }
  });
  map.addControl(new ResetControl());
